name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-stage:
    strategy:
      matrix:
        include:
          - os: macos-latest
            m2_path: ~/.m2/repository/io/github/elianfabian/
          - os: windows-latest
            m2_path: ~/.m2/repository/io/github/elianfabian/
          - os: ubuntu-latest
            m2_path: ~/.m2/repository/io/github/elianfabian/
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      
      - name: Build and Stage to Maven Local
        run: ./gradlew publishToMavenLocal --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_signing.keyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signing.password: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signing.secretKey: ${{ secrets.GPG_SIGNING_KEY }}

      - name: Upload Local Repo Artifact
        uses: actions/upload-artifact@v4
        with:
          name: staged-repo-${{ matrix.os }}
          path: ${{ matrix.m2_path }}

  merge-and-publish:
    needs: build-and-stage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      
      - name: Download All Staged Artifacts
        uses: actions/download-artifact@v4
        with:
          path: staged-artifacts

      - name: Merge Repositories
        run: |
          mkdir -p ~/.m2/repository/io/github/elianfabian
          find staged-artifacts -type f -name "*.pom" -exec dirname {} \; | sort -u | while read dir; do
            relative_dir=${dir#staged-artifacts/staged-repo-*/io/github/elianfabian/}
            mkdir -p ~/.m2/repository/io/github/elianfabian/$relative_dir
            cp -n $dir/* ~/.m2/repository/io/github/elianfabian/$relative_dir/ 2>/dev/null || true
          done

      - name: Publish Libraries to Maven Central
        run: ./gradlew publishAllPublicationsToMavenCentralRepository --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signing.keyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signing.password: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signing.secretKey: ${{ secrets.GPG_SIGNING_KEY }}

      - name: Publish Plugin to Portal
        run: ./gradlew :kproxyable-gradle-plugin:publishPlugins --no-configuration-cache
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
