name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      
      - name: Make Gradlew Executable
        run: chmod +x gradlew
        if: runner.os != 'Windows'
      
      - name: Publish Platform Artifacts
        # Gradle natively maps ORG_GRADLE_PROJECT_a__b to project property 'a.b'
        run: ./gradlew publishAllPublicationsToMavenCentralRepository --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signing__keyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signing__password: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signing__secretKey: ${{ secrets.GPG_SIGNING_KEY }}

      - name: Publish Plugin to Portal
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew :kproxyable-gradle-plugin:publishPlugins --no-configuration-cache
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
